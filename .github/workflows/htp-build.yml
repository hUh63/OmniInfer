name: Build llama.cpp Snapdragon HTP runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-htp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (https URLs)
        run: |
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git config --global --add safe.directory '*'
          git config --global http.postBuffer 524288000
          git submodule update --init framework/llama.cpp

      - name: Configure (snapdragon preset)
        working-directory: framework/llama.cpp
        run: |
          cp docs/backend/snapdragon/CMakeUserPresets.json .
          cmake --preset arm64-android-snapdragon-release -B build-snapdragon

      - name: Build
        working-directory: framework/llama.cpp
        run: cmake --build build-snapdragon -j $(nproc)

      - name: Collect shared libraries
        working-directory: framework/llama.cpp
        run: |
          mkdir -p htp-out
          find build-snapdragon -name "*.so" -exec cp {} htp-out/ \; || true
          ls -la htp-out

      - name: Push libs via contents API
        working-directory: framework/llama.cpp
        shell: bash
        run: |
          set -e
          for f in htp-out/*.so; do
            B64=$(base64 -w0 "$f")
            NAME=$(basename "$f")
            printf '{"message":"add %s","content":"%s"}' "$NAME" "$B64" > /tmp/body.json
            for try in 1 2 3; do
              CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/htp-libs/$NAME" \
                -d @/tmp/body.json) && break
              sleep 3
            done
            echo "$NAME -> $CODE"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-htp-libs
          path: framework/llama.cpp/htp-out
          if-no-files-found: error
